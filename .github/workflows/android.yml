name: R2dPass Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build r2dpass
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Node and React Native
        run: |
          node --version
          npm --version
          npx react-native --version

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Verify Java and Gradle
        working-directory: android
        run: |
          java -version
          ./gradlew --version

      - name: Clean Android build
        working-directory: android
        run: ./gradlew clean --stacktrace --no-daemon

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Verify APK output
        run: |
          echo "===== GENERATED APK FILES ====="
          find android/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: r2dpass-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: r2dpass-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
